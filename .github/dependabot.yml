version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      vue-ecosystem:
        patterns:
          - "vue"
          - "vue-*"
          - "@vue/*"
          - "pinia"
      build-tools:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "esbuild"
          - "typescript"
          - "vue-tsc"
      testing:
        patterns:
          - "vitest"
          - "playwright*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
